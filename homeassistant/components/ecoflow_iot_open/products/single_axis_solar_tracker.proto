syntax = "proto3";

message AnglePack
{
    optional int32 angle = 1;
}

message setMessage {
    setHeader header = 1;
}

message setHeader {
    setValue pdata = 1;
    int32 src = 2;
    int32 dest = 3;
    int32 d_src = 4;
    int32 d_dest = 5;
    int32 enc_type = 6;
    int32 check_type = 7;
    int32 cmd_func = 8;
    int32 cmd_id = 9;
    int32 data_len = 10;
    int32 need_ack = 11;
    int32 is_ack = 12;
    int32 seq = 14;
    int32 product_id = 15;
    int32 version = 16;
    int32 payload_ver = 17;
    int32 time_snap = 18;
    int32 is_rw_cmd = 19;
    int32 is_queue = 20;
    int32 ack_type = 21;
    string code = 22;
    string from = 23;
    string module_sn = 24;
    string device_sn = 25;
}

message Heartbeat1 {
    optional int32 angle = 9;
}

message Heartbeat2 {
    optional int32 scenes = 1;
    optional int32 word = 2;
    optional int32 mode = 3;
    optional int32 lux = 4;
    optional int32 int_5 = 5;
    optional int32 int_6 = 6;
    optional int32 int_7 = 7;
    optional int32 int_8 = 8;
    optional int32 angle = 9;
    optional int32 angle_manual = 10;
    optional int32 angle_target = 11;
    optional int32 int_12 = 12;
    optional int32 int_13 = 13;
    optional int32 battery_percent = 14;
    optional int32 battery_temperature = 15;
    optional int32 switch_state = 16;
    optional int32 int_17 = 17;
    optional int32 track_tim = 18;
    optional int32 str_lux = 19;
    optional int32 light_sen = 20;
    optional int32 shake_sen = 21;
}

message setValue {
    optional int32 value = 1;
	optional int32 value2 = 2;
}

message getMessage {

    optional messageSubMsg data = 1;

    message paramsSubMsg {

        optional int32 scenes = 1;
        optional int32 word = 2;
        optional int32 mode = 3;
        optional int32 lux = 4;
        optional int32 int_5 = 5;
        optional int32 int_6 = 6;
        optional int32 int_7 = 7;
        optional int32 int_8 = 8;
        optional int32 int_9 = 9;
        optional int64 angle_manual = 10;
        optional int32 angle_target = 11;
        optional int32 int_12 = 12;
        optional int32 int_13 = 13;
        optional int32 battery_percent = 14;
        optional int32 battery_temperature = 15;
        optional int32 switch_state = 16;
        optional int32 int_17 = 17;
        optional int32 track_tim = 18;
        optional int32 str_lux = 19;
        optional int32 light_sen = 20;
        optional int32 shake_sen = 21;
        optional int32 int_22 = 22;
        optional int32 int_23 = 23;
        optional int32 int_24 = 24;
        optional int32 int_25 = 25;
        optional int32 int_26 = 26;
        optional int32 int_27 = 27;
    }

    message messageSubMsg {

        optional paramsSubMsg params = 1;
        optional int32 src = 2;
        optional int32 dest = 3;
        optional int32 d_src = 4;
        optional int32 d_dest = 5;
        optional int32 enc_type = 6;
        optional int32 check_type = 7;
        optional int32 cmd_func = 8;
        optional int32 cmd_id = 9;
        optional int32 data_len = 10;
        optional int32 need_ack = 11;
        optional int32 is_ack = 12;
    }
}